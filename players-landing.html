<body>
  <header class="site-header">
    <a href="/" class="brand-left">
      <img class="top-left-logo" src="graphics/logoWText.png" alt="Oche Ness Monsters">
    </a>

    <img class="logo" src="graphics/onmLogoWhiteFit.png" alt="Oche Ness Monsters">

    <nav class="nav-links desktop-nav">
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="results.html">Results & Stats</a></li>
        <li><a href="players-landing.html" class="active">Players</a></li>
        <li><a href="/games.html">Play</a></li>
        <li><a href="/match">Match</a></li>
      </ul>
    </nav>

    <button id="authNavBtn" type="button" class="authProfileBtn">
      <span class="authProfileInitial">👤</span>
    </button>

    <button class="hamburger" type="button" onclick="toggleSidebar()">☰</button>
  </header>

  <div id="sidebar" class="sidebar">
    <button class="close-btn" type="button" onclick="toggleSidebar()">✖</button>

    <a href="/">Home</a>
    <a href="results.html">Results & Stats</a>
    <a href="players-landing.html" class="active">Players</a>
    <a href="/games.html">Play</a>

    <a href="/match">Match</a>
  </div>

  <main>

    <div class="player-stats-container">
      <!-- Shared-style header, but landing-only behaviour -->
      <div class="stats-header main-profile-header">

        <!-- LEFT -->
        <div class="stats-header-left">

          <label class="sort-label" for="sortBySelect">
            Sort by:
            <select id="sortBySelect" class="sort-select">
              <option value="checkouts" selected>Checkouts</option>
              <option value="joined">Date joined</option>
              <option value="coRatio">Checkout Ratio</option>
              <option value="played">Games played</option>
              <option value="wins">Wins</option>
              <option value="fines">Fines</option>
              <option value="fineRatio">Fine Ratio</option>
              <option value="one80s">180 Count</option>
              <option value="bulls">Bull-Outs</option>
              <option value="tonPlus">Ton+ Outs</option>
            </select>
          </label>
        </div>

        <!-- MIDDLE -->
        <div class="stats-header-middle">
          <h2 class="profile-title title-middle only-desktop">
            All players
          </h2>
        </div>

        <!-- RIGHT -->
        <div class="stats-header-right">
          <div class="players-search">
            <input id="playerSearch" class="player-search" type="search" placeholder="Search players…" aria-label="Search players"
              autocomplete="off" />
          </div>
        </div>


      </div>


      <section id="playersLanding">
        <div class="players-landing-wrapper">
          <div class="players-mobile-head" role="group" aria-label="Sort all-time player stats">
            <button type="button" data-player-sort="name" aria-label="Player name" aria-pressed="false" disabled>Player</button>
            <button type="button" data-player-sort="played" aria-label="Games played" aria-pressed="false" disabled>P</button>
            <button type="button" data-player-sort="checkouts" aria-label="Checkouts" aria-pressed="false" disabled>CO</button>
            <button type="button" data-player-sort="wins" aria-label="Wins" aria-pressed="false" disabled>W</button>
            <button type="button" data-player-sort="fines" aria-label="Fines" aria-pressed="false" disabled>Fines</button>
            <button type="button" data-player-sort="specials" aria-label="Total specials" aria-pressed="false" disabled>Specials</button>
            <button type="button" data-player-sort="accolades" aria-label="Accolades" aria-pressed="false" disabled>🏆</button>
          </div>
          <div id="playersGrid" class="players-grid"></div>
        </div>
      </section>
    </div>

  </main>

  <script src="scripts/firebase-client.js?v=20261104-player-identity"></script>
  <script src="scripts/season-data.js?v=20261014-admin"></script>
  <script src="scripts/player-data.js?v=20261016-registration"></script>
  <script src="scripts/player-landing.js?v=20261124-profile-honours"></script>
  <script src="scripts/linked-player-badges.js?v=20261120-linked-badges"></script>
  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      sidebar.classList.toggle("active");
    }
    document.querySelectorAll("#sidebar a").forEach(a => {
      a.addEventListener("click", () => {
        document.getElementById("sidebar").classList.remove("active");
      });
    });
  </script>
  <script src="scripts/player-data.js?v=20261016-registration"></script>
  <script src="scripts/session.js?v=20261028-avatar-fill"></script>
  <script src="scripts/profile.js?v=20261025-profile-navigation"></script>
<script src="/scripts/site-ui.js?v=20261028-avatar-fill"></script></body>

</html>
