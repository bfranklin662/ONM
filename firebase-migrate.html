<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ONM Firebase migration</title>
  <link rel="stylesheet" href="styles/global.css">
  <style>
    body { background:#070c13; color:#fff; font-family:Arial,sans-serif; margin:0; }
    .migrationCard { width:min(620px,calc(100% - 32px)); margin:60px auto; padding:28px; border:1px solid #284052; border-radius:16px; background:#101722; }
    .migrationCard h1 { margin-top:0; }
    .migrationCard label { display:block; margin:16px 0 6px; font-weight:700; }
    .migrationCard input { box-sizing:border-box; width:100%; padding:12px; border-radius:8px; border:1px solid #456; }
    .migrationCard button { margin-top:18px; padding:12px 18px; border:0; border-radius:8px; background:#008d78; color:#fff; font-weight:800; cursor:pointer; }
    .migrationCard button:disabled { opacity:.55; cursor:wait; }
    #migrationLog { margin-top:20px; padding:14px; min-height:54px; white-space:pre-line; border-radius:8px; background:#080d14; color:#d4e5ed; }
    .hidden { display:none; }
  </style>

  <!-- Shared Monsters branding: browser, home screen and link previews. -->
  <link rel="icon" type="image/png" sizes="32x32" href="/graphics/icons/favicon-32.png?v=20261104-brand">
  <link rel="icon" type="image/png" sizes="48x48" href="/graphics/icons/favicon-48.png?v=20261104-brand">
  <link rel="apple-touch-icon" sizes="180x180" href="/graphics/icons/apple-touch-icon.png?v=20261104-brand">
  <link rel="manifest" href="/site.webmanifest?v=20261104-brand">
  <meta name="theme-color" content="#0c2419">
  <meta name="application-name" content="Oche Ness Monsters">
  <meta name="apple-mobile-web-app-title" content="Monsters">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ONM Firebase migration">
  <meta name="twitter:description" content="Oche Ness Monsters — London darts, fixtures, results and games.">
  <meta name="twitter:image" content="https://ochenessmonsters.com/graphics/icons/share-monsters.png?v=20261104-brand">
  <meta property="og:site_name" content="Oche Ness Monsters">
  <meta property="og:title" content="ONM Firebase migration">
  <meta property="og:description" content="Oche Ness Monsters — London darts, fixtures, results and games.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ochenessmonsters.com/firebase-migrate.html">
  <meta property="og:image" content="https://ochenessmonsters.com/graphics/icons/share-monsters.png?v=20261104-brand">
  <meta property="og:image:secure_url" content="https://ochenessmonsters.com/graphics/icons/share-monsters.png?v=20261104-brand">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Oche Ness Monsters club logo on a dark green background">
</head>
<body>
  <main class="migrationCard">
    <h1>Firebase migration</h1>
    <p>This private utility copies the packaged ONM players, results and fixtures into Firebase. It is safe to run again.</p>

    <form id="migrationLogin">
      <label for="migrationFirstName">First name (needed only when creating the account)</label>
      <input id="migrationFirstName" type="text" autocomplete="given-name">
      <label for="migrationSurname">Surname (needed only when creating the account)</label>
      <input id="migrationSurname" type="text" autocomplete="family-name">
      <label for="migrationEmail">Firebase account email</label>
      <input id="migrationEmail" type="email" autocomplete="username" required>
      <label for="migrationPassword">Password</label>
      <input id="migrationPassword" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
      <button id="createFirebaseOwner" type="button">Create Firebase account</button>
    </form>

    <section id="migrationActions" class="hidden">
      <p id="migrationUser"></p>
      <button id="runMigration" type="button">Import existing website data</button>
    </section>

    <div id="migrationLog" role="status">Sign in with the Firebase owner account.</div>
  </main>

  <script src="scripts/firebase-client.js?v=20261104-player-identity"></script>
  <script src="scripts/firebase-migrate.js"></script>
</body>
</html>
